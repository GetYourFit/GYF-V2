# Keep the production Render API's DB pool and page cache warm.
#
# Production is the single paid, always-on Render Starter in Virginia
# (`gyf-api-va`) — it does not auto-sleep like Render's free tier. But an idle
# gap still lets the Postgres connection pool and page cache go cold, so the
# first real catalog request after a lull pays a 10-13s penalty. Pinging a
# DB-touching route every ~5 min keeps that path warm.
#
# GitHub's scheduled runs are best-effort and can be delayed 10-30 min under
# load, so an occasional cold hit can still slip through.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *" # every ~5 min (GitHub may delay this under load)
  workflow_dispatch: {} # allow manual "wake it now"

# Never let overlapping pings pile up if a run is slow.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          # /items/browse?k=1, not /health: health never touches the DB, so the
          # instance stayed warm while the Postgres pool + page cache went cold —
          # the first real catalog request after a lull still paid 10–13s.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 \
              "https://gyf-api-va.onrender.com/items/browse?k=1" || echo "000")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "health check did not return 200 after retries" >&2
          exit 1
