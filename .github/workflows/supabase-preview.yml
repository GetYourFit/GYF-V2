name: Supabase Preview

# GYF owns schema changes in Alembic (services/api/db/migrations), not in a second
# supabase/migrations tree. Every PR proves the full migration chain against
# disposable local Postgres. Remote create/update previews are intentionally disabled:
# a PR head must never execute with provider or generated database credentials.
# Production is never a target of this workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-contract:
    name: Supabase Preview
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # ubuntu-24.04 includes PostgreSQL 16. Installing pgvector on that host avoids
    # making the migration contract depend on a Docker Hub service-image pull.
    runs-on: ubuntu-24.04
    env:
      GYF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gyf
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Start PostgreSQL with pgvector
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql --command="ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb gyf
          sudo -u postgres psql --dbname=gyf --command="CREATE EXTENSION IF NOT EXISTS vector;"
          pg_isready --host=localhost --username=postgres --dbname=gyf
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra postgres --extra migrate --extra otel --extra sentry
      - name: Apply the complete Alembic chain
        run: GYF_DATABASE_URL="$GYF_TEST_DATABASE_URL" uv run alembic upgrade head
      - name: Run API regression suite against preview schema
        run: uv run pytest -q

  # Closed-PR cleanup runs the reviewed base workflow only. It neither checks out,
  # downloads, nor executes code or artifacts from the PR head.
  cleanup-remote-branch:
    name: Delete Supabase preview branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: EXPO_TOKEN
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check optional remote preview configuration
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Remote Supabase preview is not configured; nothing to clean up."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: latest
      - name: Delete isolated branch
        if: steps.gate.outputs.enabled == 'true'
        run: supabase --experimental branches delete "$PREVIEW_BRANCH" --project-ref "$SUPABASE_PROJECT_REF"
