name: CD

# Continuous delivery. Runs only after CI succeeds on main.
#
# Render Static is the authorized production web owner once the RENDER_PRODUCTION
# environment is enabled: deploy an isolated candidate service, verify its actual
# HTTP boundary, then deploy the same commit to the retained production service.
# A failed candidate verification has no path to the production deploy command.
# Render has no immutable per-deploy public URL, so service/deploy IDs, the isolated
# candidate URL, exact bundle hash, headers, API identity and rollback target are
# retained as the provider limitation contract.
#
# Until the Render production environment is deliberately enabled, the existing EAS
# production lane remains unchanged. Vercel and EAS assets are retained. API
# production is the owner-approved Virginia Render Starter service managed from
# render.yaml. Oregon is rollback-only. Do not add a Singapore deployment path.
#
# Required GitHub environment secrets (the job binds to environment `EXPO_TOKEN`):
#   EXPO_TOKEN                         — EAS token for Expo web hosting
#   EXPO_PUBLIC_SUPABASE_ANON_KEY      — current Supabase publishable key
# Required GitHub environment variables:
#   EXPO_PUBLIC_API_URL                — production Virginia API URL
#   EXPO_PUBLIC_SUPABASE_URL           — Supabase project URL

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-expo-web:
    name: Deploy Expo web (EAS Hosting comparison/rollback lane)
    environment: EXPO_TOKEN
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.RENDER_PRODUCTION_ENABLED != 'true' }}
    defaults:
      run:
        working-directory: apps/expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SOURCE_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source SHA and default-branch freshness
        id: provenance
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source workflow SHA is missing or malformed." >&2
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$SOURCE_WORKFLOW_HEAD_SHA" ]]; then
            echo "Checked out $checked_out_sha, expected $SOURCE_WORKFLOW_HEAD_SHA." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          latest_default_sha=$(git rev-parse FETCH_HEAD)
          if [[ "$latest_default_sha" != "$SOURCE_WORKFLOW_HEAD_SHA" ]]; then
            echo "Refusing to deploy stale main commit $SOURCE_WORKFLOW_HEAD_SHA; current $DEFAULT_BRANCH is $latest_default_sha." >&2
            exit 1
          fi
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "CHECKED_OUT_SHA=$checked_out_sha" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_RELEASE_SHA=$checked_out_sha" >> "$GITHUB_ENV"
          echo "Deploy source verified: $checked_out_sha is current $DEFAULT_BRANCH."

      - name: Initialize release diagnostics
        working-directory: ${{ github.workspace }}
        run: mkdir -p apps/expo/deploy-records

      - name: Check EAS configuration
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured; refusing an unverified production release." >&2
            exit 1
          elif [ -z "$EXPO_PUBLIC_API_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Expo public production environment is incomplete." >&2
            exit 1
          elif [[ "$EXPO_PUBLIC_API_URL" != https://* ]] || [[ "$EXPO_PUBLIC_SUPABASE_URL" != https://* ]]; then
            echo "Expo API and Supabase URLs must use HTTPS." >&2
            exit 1
          elif [[ "$EXPO_PUBLIC_SUPABASE_ANON_KEY" != sb_publishable_?* ]]; then
            echo "Expo requires a current Supabase publishable key; refusing a legacy anon JWT." >&2
            exit 1
          fi
          echo "EAS production configuration is present and uses HTTPS/public Supabase credentials."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Run Expo Doctor
        working-directory: ${{ github.workspace }}
        run: bun --cwd apps/expo run doctor

      - name: Export and create immutable non-production deployment
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=immutable-deploy" >> "$GITHUB_ENV"
          npx expo export --platform web --clear
          node scripts/verify-cuelinks-web-export.mjs --evidence-file deploy-records/cuelinks-export-evidence.json
          if ! grep -R -F -- "$EXPO_PUBLIC_SUPABASE_URL" dist >/dev/null; then
            echo "Expo bundle does not contain configured Supabase URL; refusing deploy." >&2
            exit 1
          fi
          if ! grep -R -F -- "$EXPO_PUBLIC_API_URL" dist >/dev/null; then
            echo "Expo bundle does not contain configured API URL; refusing deploy." >&2
            exit 1
          fi
          if ! grep -R -F -- "$EXPO_PUBLIC_SUPABASE_ANON_KEY" dist >/dev/null; then
            echo "Expo bundle does not contain configured Supabase publishable key; refusing deploy." >&2
            exit 1
          fi
          if grep -R -F -- 'eyJhbGciOiJIUzI1Ni' dist >/dev/null; then
            echo "Expo bundle contains a legacy Supabase JWT; refusing deploy." >&2
            exit 1
          fi
          npm exec --yes eas-cli@21.4.0 -- deploy --non-interactive --dev-domain=get-your-fit | tee deploy-records/eas-deploy.log
          node scripts/eas-deployment-id.mjs deploy-records/eas-deploy.log > deploy-records/deployment-id.txt
          node scripts/verify-deploy.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --cuelinks-evidence deploy-records/cuelinks-export-evidence.json \
            --evidence-file deploy-records/verification-evidence.json

      - name: Promote the verified immutable deployment
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=promotion" >> "$GITHUB_ENV"
          deployment_id=$(cat deploy-records/deployment-id.txt)
          npm exec --yes eas-cli@21.4.0 -- deploy:alias --prod --non-interactive --id="$deployment_id" | tee deploy-records/eas-promotion.log
          if ! grep -qi "promoted deployment to production" deploy-records/eas-promotion.log; then
            echo "Pinned EAS CLI did not confirm production promotion; release is not successful." >&2
            exit 1
          fi

      - name: Verify promoted release and capture provenance
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=post-promotion-verification" >> "$GITHUB_ENV"
          node scripts/verify-deploy.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --promotion-log deploy-records/eas-promotion.log \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --cuelinks-evidence deploy-records/cuelinks-export-evidence.json \
            --evidence-file deploy-records/verification-evidence.json
          node scripts/capture-deploy-record.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --promotion-log deploy-records/eas-promotion.log \
            --verification-evidence deploy-records/verification-evidence.json \
            --artifact-output deploy-records/rollback-record.json \
            --summary-output deploy-records/rollback-record-summary.md

      - name: Publish Expo rollback record
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-verified-release-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 30
          if-no-files-found: error

      - name: Publish Expo rollback summary
        if: ${{ success() }}
        run: cat deploy-records/rollback-record-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Capture failed deployment diagnostic
        if: ${{ failure() }}
        working-directory: ${{ github.workspace }}
        run: |
          node apps/expo/scripts/capture-deploy-diagnostic.mjs \
            --records-dir apps/expo/deploy-records \
            --output apps/expo/deploy-records/failed-deployment-diagnostic.json

      - name: Publish failed deployment diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-failed-deployment-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 30
          if-no-files-found: warn

  deploy-render-static:
    name: Deploy Expo web (Render Static candidate then production)
    environment: RENDER_PRODUCTION
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.RENDER_PRODUCTION_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/expo
    env:
      RENDER_PRODUCTION_ENABLED: ${{ vars.RENDER_PRODUCTION_ENABLED }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_CANDIDATE_SERVICE_ID: ${{ vars.RENDER_CANDIDATE_SERVICE_ID }}
      RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
      RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
      RENDER_CANDIDATE_URL: ${{ vars.RENDER_CANDIDATE_URL }}
      RENDER_PRODUCTION_URL: ${{ vars.RENDER_PRODUCTION_URL }}
      RENDER_CANONICAL_URL: ${{ vars.RENDER_CANONICAL_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      GYF_E2E_EMAIL: ${{ secrets.GYF_E2E_EMAIL }}
      GYF_E2E_PASSWORD: ${{ secrets.GYF_E2E_PASSWORD }}
      SOURCE_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify source and Render release configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_WORKFLOW_HEAD_SHA" ]]
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_WORKFLOW_HEAD_SHA" ]]
          node apps/expo/scripts/validate-render-environment.mjs
          echo "CHECKED_OUT_SHA=$SOURCE_WORKFLOW_HEAD_SHA" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_RELEASE_SHA=$SOURCE_WORKFLOW_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install Render CLI 2.7.0
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --max-time 60 \
            https://github.com/render-oss/cli/releases/download/v2.7.0/cli_2.7.0_linux_amd64.zip \
            --output render-cli.zip
          unzip -q render-cli.zip
          chmod 755 cli_v2.7.0
          sudo mv cli_v2.7.0 /usr/local/bin/render
          render --version
          render blueprints validate infra/render-expo-static.yaml --workspace "$RENDER_WORKSPACE_ID" --output json --confirm

      - name: Configure Render Static headers and identity rewrite
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node apps/expo/scripts/configure-render-static.mjs \
            --workspace-id "$RENDER_WORKSPACE_ID" \
            --candidate-service-id "$RENDER_CANDIDATE_SERVICE_ID" \
            --production-service-id "$RENDER_PRODUCTION_SERVICE_ID"

      - name: Export and fingerprint the candidate locally
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p apps/expo/deploy-records
          EXPO_NO_TELEMETRY=1 EXPO_NO_DOCTOR=1 npx --yes expo@57.0.9 export --platform web --clear
          node apps/expo/scripts/verify-cuelinks-web-export.mjs --evidence-file apps/expo/deploy-records/cuelinks-export-evidence.json
          node apps/expo/scripts/check-web-env.mjs
          entry_path=$(find apps/expo/dist/client/_expo/static/js/web apps/expo/dist/_expo/static/js/web -name 'entry-*.js' -print -quit 2>/dev/null || true)
          [[ -n "$entry_path" ]]
          entry_bundle=$(basename "$entry_path")
          entry_hash=${entry_bundle#entry-}; entry_hash=${entry_hash%.js}
          echo "EXPECTED_ENTRY_BUNDLE=$entry_bundle" >> "$GITHUB_ENV"
          echo "EXPECTED_ENTRY_HASH=$entry_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_ENTRY_SHA256=$(sha256sum "$entry_path" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          EXPO_PUBLIC_RELEASE_SHA="$CHECKED_OUT_SHA" node apps/expo/scripts/write-static-release-identity.mjs

      - name: Deploy isolated Render candidate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          render deploys create "$RENDER_CANDIDATE_SERVICE_ID" --commit "$CHECKED_OUT_SHA" --wait --output json --confirm > apps/expo/deploy-records/render-candidate-deploy.json
          candidate_deploy_id=$(jq -r '.id // .deploy.id // .deployId // empty' apps/expo/deploy-records/render-candidate-deploy.json)
          [[ "$candidate_deploy_id" =~ ^[a-z0-9-]+$ ]]
          echo "RENDER_CANDIDATE_DEPLOY_ID=$candidate_deploy_id" >> "$GITHUB_ENV"

      - name: Verify candidate before any production deploy
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node apps/expo/scripts/verify-render-browser-surfaces.mjs \
            --stage candidate \
            --deployment-url "$RENDER_CANDIDATE_URL" \
            --evidence-file apps/expo/deploy-records/render-candidate-browser-verification.json
          node apps/expo/scripts/verify-render-static-deploy.mjs \
            --stage candidate \
            --deployment-url "$RENDER_CANDIDATE_URL" \
            --service-id "$RENDER_CANDIDATE_SERVICE_ID" \
            --deploy-id "$RENDER_CANDIDATE_DEPLOY_ID" \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --expected-entry-bundle "$EXPECTED_ENTRY_BUNDLE" \
            --expected-entry-hash "$EXPECTED_ENTRY_HASH" \
            --expected-entry-sha256 "$EXPECTED_ENTRY_SHA256" \
            --cuelinks-evidence apps/expo/deploy-records/cuelinks-export-evidence.json \
            --evidence-file apps/expo/deploy-records/render-candidate-verification.json
          node apps/expo/scripts/verify-render-authenticated-core-loop.mjs \
            --stage candidate --deployment-url "$RENDER_CANDIDATE_URL" \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --evidence-file apps/expo/deploy-records/render-candidate-authenticated-core-loop.json

      - name: Capture retained production deploy for rollback
        working-directory: ${{ github.workspace }}
        run: render deploys list "$RENDER_PRODUCTION_SERVICE_ID" --output json --confirm > apps/expo/deploy-records/render-previous-deploys.json

      - name: Promote verified candidate to Render production service
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          render deploys create "$RENDER_PRODUCTION_SERVICE_ID" --commit "$CHECKED_OUT_SHA" --wait --output json --confirm > apps/expo/deploy-records/render-production-deploy.json
          production_deploy_id=$(jq -r '.id // .deploy.id // .deployId // empty' apps/expo/deploy-records/render-production-deploy.json)
          [[ "$production_deploy_id" =~ ^[a-z0-9-]+$ ]]
          echo "RENDER_PRODUCTION_DEPLOY_ID=$production_deploy_id" >> "$GITHUB_ENV"

      - name: Verify Render production service and canonical domain
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node apps/expo/scripts/verify-render-browser-surfaces.mjs \
            --stage production \
            --deployment-url "$RENDER_PRODUCTION_URL" \
            --evidence-file apps/expo/deploy-records/render-production-browser-verification.json
          node apps/expo/scripts/verify-render-static-deploy.mjs \
            --stage production \
            --deployment-url "$RENDER_PRODUCTION_URL" \
            --service-id "$RENDER_PRODUCTION_SERVICE_ID" \
            --deploy-id "$RENDER_PRODUCTION_DEPLOY_ID" \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --expected-entry-bundle "$EXPECTED_ENTRY_BUNDLE" \
            --expected-entry-hash "$EXPECTED_ENTRY_HASH" \
            --expected-entry-sha256 "$EXPECTED_ENTRY_SHA256" \
            --cuelinks-evidence apps/expo/deploy-records/cuelinks-export-evidence.json \
            --evidence-file apps/expo/deploy-records/render-production-verification.json
          node apps/expo/scripts/verify-render-browser-surfaces.mjs \
            --stage canonical \
            --deployment-url "$RENDER_CANONICAL_URL" \
            --evidence-file apps/expo/deploy-records/render-canonical-browser-verification.json
          node apps/expo/scripts/verify-render-static-deploy.mjs \
            --stage canonical \
            --deployment-url "$RENDER_CANONICAL_URL" \
            --service-id "$RENDER_PRODUCTION_SERVICE_ID" \
            --deploy-id "$RENDER_PRODUCTION_DEPLOY_ID" \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --expected-entry-bundle "$EXPECTED_ENTRY_BUNDLE" \
            --expected-entry-hash "$EXPECTED_ENTRY_HASH" \
            --expected-entry-sha256 "$EXPECTED_ENTRY_SHA256" \
            --cuelinks-evidence apps/expo/deploy-records/cuelinks-export-evidence.json \
            --evidence-file apps/expo/deploy-records/render-canonical-verification.json
          for stage in production canonical; do
            url_var="RENDER_${stage^^}_URL"
            node apps/expo/scripts/verify-render-authenticated-core-loop.mjs \
              --stage "$stage" --deployment-url "${!url_var}" \
              --api-url "$EXPO_PUBLIC_API_URL" \
              --evidence-file "apps/expo/deploy-records/render-${stage}-authenticated-core-loop.json"
          done

      - name: Capture Render provenance and rollback contract
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node apps/expo/scripts/capture-render-release-record.mjs \
            --source-sha "$CHECKED_OUT_SHA" \
            --workflow-run-id "$SOURCE_WORKFLOW_RUN_ID" \
            --candidate-deploy apps/expo/deploy-records/render-candidate-deploy.json \
            --production-deploy apps/expo/deploy-records/render-production-deploy.json \
            --previous-deploys apps/expo/deploy-records/render-previous-deploys.json \
            --candidate-verification apps/expo/deploy-records/render-candidate-verification.json \
            --production-verification apps/expo/deploy-records/render-production-verification.json \
            --candidate-browser-verification apps/expo/deploy-records/render-candidate-browser-verification.json \
            --production-browser-verification apps/expo/deploy-records/render-production-browser-verification.json \
            --canonical-verification apps/expo/deploy-records/render-canonical-verification.json \
            --canonical-browser-verification apps/expo/deploy-records/render-canonical-browser-verification.json \
            --candidate-authenticated-core-loop apps/expo/deploy-records/render-candidate-authenticated-core-loop.json \
            --production-authenticated-core-loop apps/expo/deploy-records/render-production-authenticated-core-loop.json \
            --canonical-authenticated-core-loop apps/expo/deploy-records/render-canonical-authenticated-core-loop.json \
            --production-service-id "$RENDER_PRODUCTION_SERVICE_ID" \
            --output apps/expo/deploy-records/render-release-record.json \
            --summary-output apps/expo/deploy-records/render-release-summary.md

      - name: Publish Render provenance and rollback evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: render-static-verified-release-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 90
          if-no-files-found: error

      - name: Publish Render release summary
        if: ${{ success() }}
        run: cat apps/expo/deploy-records/render-release-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Capture failed Render release diagnostic
        if: ${{ failure() }}
        working-directory: ${{ github.workspace }}
        run: node apps/expo/scripts/capture-render-failure-diagnostic.mjs --records-dir apps/expo/deploy-records --output apps/expo/deploy-records/render-failed-deployment-diagnostic.json

      - name: Publish failed Render release diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: render-static-failed-release-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 30
          if-no-files-found: warn
