name: CD

# Continuous delivery. Runs only after CI succeeds on main.
#
# The EAS release is transactional at the repository boundary: create an immutable
# non-production deployment, verify it (including source/API identity, bundle,
# headers and Cuelinks), then promote that exact ID. A failed verification has no
# path to deploy:alias --prod and publishes a diagnostic instead.
#
# API production is the owner-approved Virginia Render Starter service managed
# outside this workflow from render.yaml. Oregon is rollback-only. Do not add a
# Singapore deployment path.
#
# Required GitHub environment secrets (the job binds to environment `EXPO_TOKEN`):
#   EXPO_TOKEN                         — EAS token for Expo web hosting
#   EXPO_PUBLIC_SUPABASE_ANON_KEY      — current Supabase publishable key
# Required GitHub environment variables:
#   EXPO_PUBLIC_API_URL                — production Virginia API URL
#   EXPO_PUBLIC_SUPABASE_URL           — Supabase project URL

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-expo-web:
    name: Deploy Expo web (EAS Hosting)
    environment: EXPO_TOKEN
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    defaults:
      run:
        working-directory: apps/expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SOURCE_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source SHA and default-branch freshness
        id: provenance
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source workflow SHA is missing or malformed." >&2
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$SOURCE_WORKFLOW_HEAD_SHA" ]]; then
            echo "Checked out $checked_out_sha, expected $SOURCE_WORKFLOW_HEAD_SHA." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          latest_default_sha=$(git rev-parse FETCH_HEAD)
          if [[ "$latest_default_sha" != "$SOURCE_WORKFLOW_HEAD_SHA" ]]; then
            echo "Refusing to deploy stale main commit $SOURCE_WORKFLOW_HEAD_SHA; current $DEFAULT_BRANCH is $latest_default_sha." >&2
            exit 1
          fi
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "CHECKED_OUT_SHA=$checked_out_sha" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_RELEASE_SHA=$checked_out_sha" >> "$GITHUB_ENV"
          echo "Deploy source verified: $checked_out_sha is current $DEFAULT_BRANCH."

      - name: Initialize release diagnostics
        working-directory: ${{ github.workspace }}
        run: mkdir -p apps/expo/deploy-records

      - name: Check EAS configuration
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured; refusing an unverified production release." >&2
            exit 1
          elif [ -z "$EXPO_PUBLIC_API_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Expo public production environment is incomplete." >&2
            exit 1
          elif [[ "$EXPO_PUBLIC_API_URL" != https://* ]] || [[ "$EXPO_PUBLIC_SUPABASE_URL" != https://* ]]; then
            echo "Expo API and Supabase URLs must use HTTPS." >&2
            exit 1
          elif [[ "$EXPO_PUBLIC_SUPABASE_ANON_KEY" != sb_publishable_?* ]]; then
            echo "Expo requires a current Supabase publishable key; refusing a legacy anon JWT." >&2
            exit 1
          fi
          echo "EAS production configuration is present and uses HTTPS/public Supabase credentials."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Run Expo Doctor
        working-directory: ${{ github.workspace }}
        run: bun --cwd apps/expo run doctor

      - name: Export and create immutable non-production deployment
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=immutable-deploy" >> "$GITHUB_ENV"
          npx expo export --platform web --clear
          node scripts/verify-cuelinks-web-export.mjs --evidence-file deploy-records/cuelinks-export-evidence.json
          if ! grep -R -F -- "$EXPO_PUBLIC_SUPABASE_URL" dist >/dev/null; then
            echo "Expo bundle does not contain configured Supabase URL; refusing deploy." >&2
            exit 1
          fi
          if ! grep -R -F -- "$EXPO_PUBLIC_API_URL" dist >/dev/null; then
            echo "Expo bundle does not contain configured API URL; refusing deploy." >&2
            exit 1
          fi
          if ! grep -R -F -- "$EXPO_PUBLIC_SUPABASE_ANON_KEY" dist >/dev/null; then
            echo "Expo bundle does not contain configured Supabase publishable key; refusing deploy." >&2
            exit 1
          fi
          if grep -R -F -- 'eyJhbGciOiJIUzI1Ni' dist >/dev/null; then
            echo "Expo bundle contains a legacy Supabase JWT; refusing deploy." >&2
            exit 1
          fi
          npm exec --yes eas-cli@21.4.0 -- deploy --non-interactive --dev-domain=get-your-fit | tee deploy-records/eas-deploy.log
          node scripts/eas-deployment-id.mjs deploy-records/eas-deploy.log > deploy-records/deployment-id.txt
          node scripts/verify-deploy.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --cuelinks-evidence deploy-records/cuelinks-export-evidence.json \
            --evidence-file deploy-records/verification-evidence.json

      - name: Promote the verified immutable deployment
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=promotion" >> "$GITHUB_ENV"
          deployment_id=$(cat deploy-records/deployment-id.txt)
          npm exec --yes eas-cli@21.4.0 -- deploy:alias --prod --non-interactive --id="$deployment_id" | tee deploy-records/eas-promotion.log
          if ! grep -qi "promoted deployment to production" deploy-records/eas-promotion.log; then
            echo "Pinned EAS CLI did not confirm production promotion; release is not successful." >&2
            exit 1
          fi

      - name: Verify promoted release and capture provenance
        run: |
          set -euo pipefail
          echo "RELEASE_STAGE=post-promotion-verification" >> "$GITHUB_ENV"
          node scripts/verify-deploy.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --promotion-log deploy-records/eas-promotion.log \
            --api-url "$EXPO_PUBLIC_API_URL" \
            --expected-source-sha "$CHECKED_OUT_SHA" \
            --cuelinks-evidence deploy-records/cuelinks-export-evidence.json \
            --evidence-file deploy-records/verification-evidence.json
          node scripts/capture-deploy-record.mjs \
            --deploy-log deploy-records/eas-deploy.log \
            --promotion-log deploy-records/eas-promotion.log \
            --verification-evidence deploy-records/verification-evidence.json \
            --artifact-output deploy-records/rollback-record.json \
            --summary-output deploy-records/rollback-record-summary.md

      - name: Publish Expo rollback record
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-verified-release-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 30
          if-no-files-found: error

      - name: Publish Expo rollback summary
        if: ${{ success() }}
        run: cat deploy-records/rollback-record-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Capture failed deployment diagnostic
        if: ${{ failure() }}
        working-directory: ${{ github.workspace }}
        run: |
          node apps/expo/scripts/capture-deploy-diagnostic.mjs \
            --records-dir apps/expo/deploy-records \
            --output apps/expo/deploy-records/failed-deployment-diagnostic.json

      - name: Publish failed deployment diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-failed-deployment-${{ github.event.workflow_run.run_id }}
          path: apps/expo/deploy-records/
          retention-days: 30
          if-no-files-found: warn
